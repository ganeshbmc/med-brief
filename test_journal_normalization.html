<!DOCTYPE html>
<html>
<head>
    <title>Journal Matching Test</title>
</head>
<body>
    <h1>Journal Name Normalization Test</h1>
    <div id="results"></div>

    <script>
        // Enhanced journal name normalization for robust matching
        function normalizeJournalName(name) {
            if (!name) return ''
            return name.toLowerCase()
                .trim()
                .replace(/\s+/g, ' ')              // Normalize whitespace
                .replace(/[.,;:]/g, '')            // Remove all punctuation
                .replace(/&/g, 'and')              // Normalize ampersands
                .replace(/^the\s+/, '')            // Remove leading "the"
                .replace(/\b(journal of|journal)\b/g, '') // Remove common words
                .replace(/\s+/g, ' ')              // Clean up spaces again
                .trim()
        }

        // Test cases for normalization
        const testCases = [
            // Basic punctuation
            { input: "JAMA.", expected: "jama" },
            { input: "The Lancet", expected: "lancet" },
            { input: "Circulation Research", expected: "research" },
            
            // Variations with "The" and "Journal of"
            { input: "The New England Journal of Medicine", expected: "new england medicine" },
            { input: "New England Journal of Medicine", expected: "new england medicine" },
            { input: "Journal of the American Medical Association", expected: "american medical association" },
            
            // Special characters
            { input: "Diabetes & Vascular Disease Research", expected: "diabetes and vascular disease research" },
            { input: "PLOS ONE", expected: "plos one" },
            
            // Whitespace issues
            { input: "  BMJ  ", expected: "bmj" },
            { input: "Nature   Medicine", expected: "nature medicine" },
            
            // Mixed cases
            { input: "JAMA Internal Medicine", expected: "internal medicine" },
            { input: "The Lancet. Diabetes & Endocrinology", expected: "lancet diabetes and endocrinology" },
            
            // Edge cases
            { input: "", expected: "" },
            { input: null, expected: "" },
            { input: undefined, expected: "" },
        ];

        // Run tests
        const results = testCases.map((testCase, index) => {
            const actual = normalizeJournalName(testCase.input);
            const passed = actual === testCase.expected;
            
            return {
                index,
                input: testCase.input,
                expected: testCase.expected,
                actual,
                passed
            };
        });

        // Display results
        const resultsDiv = document.getElementById('results');
        let html = '<h2>Test Results</h2>';
        
        results.forEach(result => {
            const status = result.passed ? '✅ PASS' : '❌ FAIL';
            const color = result.passed ? 'green' : 'red';
            html += `
                <div style="margin: 10px 0; padding: 10px; border: 1px solid #ccc;">
                    <strong>${status}</strong><br>
                    <strong>Input:</strong> "${result.input}"<br>
                    <strong>Expected:</strong> "${result.expected}"<br>
                    <strong>Actual:</strong> <span style="color: ${color}">"${result.actual}"</span>
                </div>
            `;
        });

        const passedCount = results.filter(r => r.passed).length;
        const totalCount = results.length;
        html += `<h3>Summary: ${passedCount}/${totalCount} tests passed</h3>`;

        resultsDiv.innerHTML = html;
    </script>
</body>
</html>
